id: vehicle_working_status
display: 车辆实时工况
description: 查询车辆当前工况：电量/速度/状态/能耗/电压电流
aliases: [工况, 实时工况, 车辆工况, 电量多少, 能耗]
domain: online
readonly: true
params:
  - name: vehicle
    type: string
    required: true
    description: 车牌号或 VIN
  - name: vin_list
    type: array<string>
    required: false
    max_items: 50
returns:
  shape: table
  columns:
    - {name: plate_no, semantic: category, display: 车牌号}
    - {name: soc, semantic: metric, display: 电量, unit: "%"}
    - {name: speed, semantic: metric, display: 速度, unit: km/h, scale: 1}
    - {name: vehicle_status, semantic: category, display: 车辆状态}
    - {name: charge_status, semantic: category, display: 充电状态}
    - {name: energy_consumption, semantic: metric, display: 累计能耗, unit: kWh, scale: 1}
    - {name: dev_time, semantic: category, display: 上报时间}
chart_hint: metric_card
source_tables: [vehicle_status_realtime_data]
freshness_policy: {type: realtime, expected_delay_min: 5}
limits: {max_rows: 50, timeout_ms: 10000}
cache: {cacheable: false}
scopes: [vehicle.status.read]
row_filter_policy: by_org
sample_questions: [这台车当前工况怎么样, 还有多少电]
owner: 数据组
status: online
sql_template: |
  SELECT COALESCE(b.car_no, t.vin_code) AS plate_no,
         t.soc,
         t.speed,
         CONCAT('状态', t.vehicle_status) AS vehicle_status,
         CONCAT('状态', t.charge_status) AS charge_status,
         ROUND(t.energy_consumption, 1) AS energy_consumption,
         t.dev_time
  FROM vehicle_status_realtime_data t
  LEFT JOIN basic_vehicle_info b ON t.vin_code = b.vin_code
  WHERE t.vin_code IN (${vin_list})
    AND t.vin_code IN (SELECT vin_code FROM basic_vehicle_info WHERE org_name IN (${acl_org_ids}))
  LIMIT 50
