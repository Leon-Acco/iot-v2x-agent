id: vehicle_online_status
display: 车辆在线状态查询
description: 查询车辆当前在线/离线状态与最近上报时间
aliases: [在线吗, 在线状态, 离线吗, 车辆状态, 电量, 还有多少电]
domain: online
readonly: true
params:
  - name: vehicle
    type: string
    required: true
    description: 车牌号或 VIN
  - name: vin_list
    type: array<string>
    required: false
    description: 车辆 VIN 列表
    max_items: 50
returns:
  shape: table
  columns:
    - {name: plate_no, semantic: category, display: 车牌号}
    - {name: online_status, semantic: category, display: 状态}
    - {name: last_report_time, semantic: category, display: 最近上报时间}
    - {name: speed, semantic: metric, display: 速度, unit: km/h, scale: 1}
    - {name: soc, semantic: metric, display: 电量, unit: "%"}
chart_hint: table
source_tables: [tbox_realtime_vehicle_data]
freshness_policy: {type: realtime, expected_delay_min: 5}
limits: {max_rows: 50, timeout_ms: 10000}
cache: {cacheable: false}
scopes: [vehicle.status.read]
row_filter_policy: by_org
sample_questions: [这台车现在在线吗, 车辆状态怎么样]
owner: 数据组
status: online
sql_template: |
  SELECT COALESCE(b.car_no, t.vin_code) AS plate_no,
         CASE WHEN t.dev_time >= DATE_SUB(NOW(), INTERVAL 30 MINUTE) THEN '在线' ELSE '离线' END AS online_status,
         t.dev_time AS last_report_time,
         t.speed,
         t.soc
  FROM tbox_realtime_vehicle_data t
  LEFT JOIN basic_vehicle_info b ON t.vin_code = b.vin_code
  WHERE t.vin_code IN (${vin_list})
    AND t.vin_code IN (SELECT vin_code FROM basic_vehicle_info WHERE org_name IN (${acl_org_ids}))
  LIMIT 50
