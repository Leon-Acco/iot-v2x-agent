id: mileage_daily
display: 车辆日里程统计
description: 统计车辆每日行驶里程（采集器累计里程差值）
aliases: [日里程, 每日里程, 里程趋势, 行驶里程, 每天跑多少, 多少公里]
domain: mileage
readonly: true
params:
  - name: time_range
    type: daterange
    required: true
    max_span_days: 31
    description: 时间范围，如 近7天 / 本周
  - name: vehicle
    type: string
    required: false
    description: 车牌号或 VIN
  - name: vin_list
    type: array<string>
    required: false
    description: 车辆 VIN 列表
    max_items: 20
returns:
  shape: table
  columns:
    - {name: stat_date, semantic: category, display: 日期}
    - {name: vin, semantic: category, display: VIN}
    - {name: daily_mileage, semantic: metric, display: 日里程, unit: km, scale: 1}
chart_hint: line
source_tables: [vehicle_mileage_data]
freshness_policy: {type: realtime, expected_delay_min: 10}
limits: {max_rows: 1000, timeout_ms: 20000, max_span_days: 31}
cache: {cacheable: true, ttl_seconds: 300}
scopes: [vehicle.mileage.read]
row_filter_policy: by_org
sample_questions: [这台车近七天每日里程, 里程趋势怎么样]
owner: 数据组
status: online
sql_template: |
  SELECT DATE(m.data_time) AS stat_date,
         m.vin,
         ROUND(MAX(m.mileage_total) - MIN(m.mileage_total), 1) AS daily_mileage
  FROM vehicle_mileage_data m
  WHERE m.data_time >= ${time_from}
    AND m.data_time < ${time_to}
    AND m.cmd = 2
    AND (${vin_list_empty} OR m.vin IN (${vin_list}))
    AND m.vin IN (SELECT vin_code FROM basic_vehicle_info WHERE org_name IN (${acl_org_ids}))
  GROUP BY DATE(m.data_time), m.vin
  HAVING daily_mileage >= 0 AND daily_mileage < 2000
  ORDER BY stat_date, m.vin
  LIMIT 1000
