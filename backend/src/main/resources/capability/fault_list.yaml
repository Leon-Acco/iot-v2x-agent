id: fault_list
display: 车辆故障明细
description: 查询指定时间范围内车辆的故障明细记录
aliases: [故障明细, 故障记录, 故障历史, 故障列表]
domain: fault
readonly: true
params:
  - name: time_range
    type: daterange
    required: false
    default_value: 近7天
    max_span_days: 90
    description: 时间范围，如 近7天 / 本周
  - name: vehicle
    type: string
    required: false
    description: 车牌号或 VIN
  - name: vin_list
    type: array<string>
    required: false
    max_items: 50
returns:
  shape: table
  columns:
    - {name: data_time, semantic: category, display: 故障时间}
    - {name: plate_no, semantic: category, display: 车牌号}
    - {name: fault_name, semantic: category, display: 故障名称}
    - {name: fault_part, semantic: category, display: 部件}
    - {name: fault_reason, semantic: category, display: 故障原因}
chart_hint: table
source_tables: [tbox_fault_history]
freshness_policy: {type: realtime, expected_delay_min: 30}
limits: {max_rows: 500, timeout_ms: 15000, max_span_days: 90}
cache: {cacheable: false}
scopes: [vehicle.fault.read]
row_filter_policy: by_org
sample_questions: [近两天的故障明细, 这台车报了什么故障]
owner: 数据组
status: online
sql_template: |
  SELECT f.data_time,
         COALESCE(NULLIF(f.car_no, ''), f.vin_code) AS plate_no,
         f.fault_name,
         COALESCE(NULLIF(f.fault_part, ''), '未标注') AS fault_part,
         COALESCE(f.fault_reason, '') AS fault_reason
  FROM tbox_fault_history f
  WHERE f.data_time >= ${time_from}
    AND f.data_time < ${time_to}
    AND (${vin_list_empty} OR f.vin_code IN (${vin_list}))
    AND f.vin_code IN (SELECT vin_code FROM basic_vehicle_info WHERE org_name IN (${acl_org_ids}))
  ORDER BY f.data_time DESC
  LIMIT 500
