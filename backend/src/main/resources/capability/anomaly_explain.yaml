id: anomaly_explain
kind: orchestration
display: 车辆异常解释
description: 多源取证解释车辆异常原因（告警明细 + 类型分布 + 里程变化 联合分析）
aliases: [为什么告警, 频繁告警, 异常解释, 怎么回事, 异常原因]
domain: alarm
readonly: true
params:
  - name: vehicle
    type: string
    required: true
    description: 车牌号或 VIN
  - name: time_range
    type: daterange
    required: false
    default_value: 近7天
    description: 时间范围，如 近7天 / 本周
  - name: vin_list
    type: array<string>
    required: false
    description: 车辆 VIN 列表（澄清选择/多轮继承用）
    max_items: 50
returns:
  shape: table
  columns:
    - {name: summary, semantic: category, display: 分析项}
chart_hint: bar
freshness_policy: {type: realtime, expected_delay_min: 5}
limits: {max_rows: 1000, timeout_ms: 20000}
cache: {cacheable: false}
scopes: [vehicle.alarm.read]
row_filter_policy: by_fleet
sample_questions: [这台车为什么频繁告警, 沪A10011最近怎么回事, 这台车异常原因]
owner: 数据组
status: online
