id: charge_daily
display: 充电日统计
description: 统计车辆每日充电次数/电量/时长
aliases: [充电统计, 充电记录, 每日充电, 充了多少电, 充电次数]
domain: charge
readonly: true
params:
  - name: time_range
    type: daterange
    required: false
    default_value: 近7天
    max_span_days: 31
    description: 时间范围，如 近7天 / 本周
  - name: vehicle
    type: string
    required: false
    description: 车牌号或 VIN
  - name: vin_list
    type: array<string>
    required: false
    max_items: 20
returns:
  shape: table
  columns:
    - {name: query_date, semantic: category, display: 日期}
    - {name: plate_no, semantic: category, display: 车牌号}
    - {name: charge_times, semantic: metric, display: 充电次数, unit: 次}
    - {name: charge_total, semantic: metric, display: 充电电量, unit: kWh, scale: 1}
    - {name: charge_duration, semantic: metric, display: 充电时长, unit: 分钟, scale: 0}
chart_hint: bar
source_tables: [tbox_charge_day]
freshness_policy: {type: t_plus_1, expected_delay_min: 1440}
limits: {max_rows: 1000, timeout_ms: 15000, max_span_days: 31}
cache: {cacheable: true, ttl_seconds: 600}
scopes: [vehicle.charge.read]
row_filter_policy: by_org
sample_questions: [这台车近七天充了多少电, 每天充电情况]
owner: 数据组
status: online
sql_template: |
  SELECT t.query_date,
         COALESCE(NULLIF(t.plate_number, ''), t.vin_code) AS plate_no,
         t.charge_times,
         ROUND(t.charge_total, 1) AS charge_total,
         ROUND(t.charge_duration / 60, 0) AS charge_duration
  FROM tbox_charge_day t
  WHERE t.query_date >= ${time_from}
    AND t.query_date < ${time_to}
    AND (${vin_list_empty} OR t.vin_code IN (${vin_list}))
    AND t.vin_code IN (SELECT vin_code FROM basic_vehicle_info WHERE org_name IN (${acl_org_ids}))
  ORDER BY t.query_date DESC, plate_no
  LIMIT 1000
