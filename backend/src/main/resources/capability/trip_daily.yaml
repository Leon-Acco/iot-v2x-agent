id: trip_daily
display: 行程日统计
description: 统计车辆每日行驶次数/时长/里程/耗电
aliases: [行程统计, 行程记录, 每日行程, 出车次数, 跑了几趟]
domain: trip
readonly: true
params:
  - name: time_range
    type: daterange
    required: false
    default_value: 近7天
    max_span_days: 31
    description: 时间范围，如 近7天 / 本周
  - name: vehicle
    type: string
    required: false
    description: 车牌号或 VIN
  - name: vin_list
    type: array<string>
    required: false
    max_items: 20
returns:
  shape: table
  columns:
    - {name: query_date, semantic: category, display: 日期}
    - {name: plate_no, semantic: category, display: 车牌号}
    - {name: drive_times, semantic: metric, display: 行驶次数, unit: 次}
    - {name: drive_mileage, semantic: metric, display: 行驶里程, unit: km, scale: 1}
    - {name: drive_duration, semantic: metric, display: 行驶时长, unit: 分钟, scale: 0}
    - {name: drive_charge, semantic: metric, display: 耗电量, unit: kWh, scale: 1}
chart_hint: line
source_tables: [tbox_trip_day]
freshness_policy: {type: t_plus_1, expected_delay_min: 1440}
limits: {max_rows: 1000, timeout_ms: 15000, max_span_days: 31}
cache: {cacheable: true, ttl_seconds: 600}
scopes: [vehicle.trip.read]
row_filter_policy: by_org
sample_questions: [这台车近七天跑了几趟, 每天行程情况]
owner: 数据组
status: online
sql_template: |
  SELECT t.query_date,
         COALESCE(NULLIF(t.plate_number, ''), t.vin_code) AS plate_no,
         t.drive_times,
         ROUND(t.drive_mileage, 1) AS drive_mileage,
         ROUND(t.drive_duration / 60, 0) AS drive_duration,
         ROUND(t.drive_charge, 1) AS drive_charge
  FROM tbox_trip_day t
  WHERE t.query_date >= ${time_from}
    AND t.query_date < ${time_to}
    AND (${vin_list_empty} OR t.vin_code IN (${vin_list}))
    AND t.vin_code IN (SELECT vin_code FROM basic_vehicle_info WHERE org_name IN (${acl_org_ids}))
  ORDER BY t.query_date DESC, plate_no
  LIMIT 1000
