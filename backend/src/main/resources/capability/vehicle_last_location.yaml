id: vehicle_last_location
display: 车辆最后位置
description: 查询车辆最近上报的地理位置（GCJ-02 坐标）
aliases: [最后位置, 在哪, 位置在哪, 车辆位置]
domain: location
readonly: true
params:
  - name: vehicle
    type: string
    required: true
    description: 车牌号或 VIN
  - name: vin_list
    type: array<string>
    required: false
    description: 车辆 VIN 列表
    max_items: 50
returns:
  shape: table
  columns:
    - {name: plate_no, semantic: category, display: 车牌号}
    - {name: lng, semantic: geo_lng, display: 经度}
    - {name: lat, semantic: geo_lat, display: 纬度}
    - {name: report_time, semantic: category, display: 上报时间}
    - {name: city_name, semantic: category, display: 城市}
chart_hint: map
source_tables: [vehicle_realtime_position]
freshness_policy: {type: realtime, expected_delay_min: 5}
limits: {max_rows: 50, timeout_ms: 10000}
cache: {cacheable: false}
scopes: [vehicle.location.read]
row_filter_policy: by_org
sample_questions: [这台车现在在哪, 最后位置在哪里]
owner: 数据组
status: online
sql_template: |
  SELECT COALESCE(NULLIF(p.car_no, ''), p.vin_code) AS plate_no,
         ROUND(p.gcj02_lng, 6) AS lng,
         ROUND(p.gcj02_lat, 6) AS lat,
         p.report_time,
         COALESCE(p.city_name, '') AS city_name
  FROM vehicle_realtime_position p
  WHERE p.vin_code IN (${vin_list})
    AND p.vin_code IN (SELECT vin_code FROM basic_vehicle_info WHERE org_name IN (${acl_org_ids}))
    AND p.report_time > '2020-01-01'
    AND p.report_time < DATE_ADD(NOW(), INTERVAL 1 DAY)
  LIMIT 50
